<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="303mm" height="216mm" viewBox="0 0 303 216" version="1.1" role="img" aria-label="Always Beauty – Z-Falz Innenseite A4 mit 3 mm Anschnitt">
<title>Always Beauty – Z-Falz Innenseite A4 mit 3 mm Anschnitt</title><defs><linearGradient id="deepCover" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#4E3A30" /><stop offset="54%" stop-color="#302420" /><stop offset="100%" stop-color="#201A17" />
</linearGradient>
<linearGradient id="photoPanel" x1="0" y1="0" x2="1" y2=".85">
 <stop offset="0%" stop-color="#312521" /><stop offset="43%" stop-color="#47362D" /><stop offset="72%" stop-color="#624C3B" /><stop offset="100%" stop-color="#735A47" />
</linearGradient>
<linearGradient id="softCover" x1="0" y1="0" x2="1" y2=".75">
 <stop offset="0%" stop-color="#DDD0C2" /><stop offset="100%" stop-color="#F5EEE5" />
</linearGradient></defs>
<g id="inner_backdrops" inkscape:groupmode="layer" inkscape:label="Flaechen · Innen"><rect x="0" y="0" width="102" height="216" rx="0" fill="#F2EBE1" /><rect x="102" y="0" width="99" height="216" rx="0" fill="#FBF8F3" /><rect x="201" y="0" width="102" height="216" rx="0" fill="#E8DDD0" /></g>
<g id="p2" inkscape:groupmode="layer" inkscape:label="Seite 2 · Haltung und Bildplatzhalter"><text x="14" y="20" fill="#AC8C64" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="2.65" text-anchor="start" letter-spacing="0.48">01  /  DIE HALTUNG</text><text x="14" y="39.5" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="11.55" text-anchor="start" letter-spacing="0">Pflege, die zu</text>
<text x="14" y="51.0" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="11.55" text-anchor="start" letter-spacing="0">Ihnen passt.</text><line x1="14" y1="60" x2="89.5" y2="60" stroke="#AC8C64" stroke-width="0.28" opacity="1" /><text x="14" y="74.0" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.22" text-anchor="start" letter-spacing="0">Natürliche Schönheit hat keinen</text>
<text x="14" y="79.2" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.22" text-anchor="start" letter-spacing="0">festen Massstab. Entscheidend ist,</text>
<text x="14" y="84.4" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.22" text-anchor="start" letter-spacing="0">dass Sie sich in Ihrer Haut wohlfühlen.</text>
<text x="14" y="89.6" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.22" text-anchor="start" letter-spacing="0" />
<text x="14" y="94.8" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.22" text-anchor="start" letter-spacing="0">Wir finden gemeinsam heraus,</text>
<text x="14" y="100.0" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.22" text-anchor="start" letter-spacing="0">welche Pflege für Sie sinnvoll ist.</text><rect x="14" y="122" width="76" height="70" fill="url(#photoPanel)" /><path d="M39 194 C43 170 42 149 50 138 C56 128 72 125 82 129" fill="none" stroke="#E5D2B8" stroke-width="0.72" opacity="0.35" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 194 C40 172 39 146 51 136 C57 130 69 127 83 130" fill="none" stroke="#2D2420" stroke-width="0.52" opacity="0.38" stroke-linecap="round" stroke-linejoin="round" /><text x="14" y="203" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="2.2" text-anchor="start" letter-spacing="0.42">PERSÖNLICH. DISKRET. MIT ZEIT.</text><text x="19" y="166" fill="#FFFFFF" font-family="Cormorant Garamond, Garamond, Georgia, serif" font-size="9.2" text-anchor="start" letter-spacing="0">Oxana Peske</text><text x="19" y="176" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="3.2" text-anchor="start" letter-spacing="0">Inhaberin und dipl. Kosmetikerin</text><text x="19" y="182" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="2.75" text-anchor="start" letter-spacing="0">Ihre Ansprechpartnerin bei Always Beauty</text></g>
<g id="p3" inkscape:groupmode="layer" inkscape:label="Seite 3 · Ansatz"><text x="113" y="20" fill="#AC8C64" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="2.65" text-anchor="start" letter-spacing="0.48">02  /  SO BEGLEITE ICH SIE</text><text x="113" y="39.5" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="11.7" text-anchor="start" letter-spacing="0">Ihre Haut.</text>
<text x="113" y="51.4" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="11.7" text-anchor="start" letter-spacing="0">Ihr Pflegeplan.</text><text x="113" y="68.0" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.17" text-anchor="start" letter-spacing="0">Ich begleite Sie vom ersten Gespräch</text>
<text x="113" y="72.9" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.17" text-anchor="start" letter-spacing="0">bis zu den nächsten Terminen.</text>
<text x="113" y="77.8" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.17" text-anchor="start" letter-spacing="0" /><line x1="113" y1="86" x2="189" y2="86" stroke="#DCD0C1" stroke-width="0.27" opacity="1" /><text x="113" y="100" fill="#AC8C64" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="6.6" text-anchor="start" letter-spacing="0">01</text><text x="129" y="99" fill="#2D2420" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="2.6" text-anchor="start" letter-spacing="0.3">VERSTEHEN</text><text x="129" y="105.0" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.01" text-anchor="start" letter-spacing="0">Ich höre zu, schaue mir Ihre Haut an</text>
<text x="129" y="109.8" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.01" text-anchor="start" letter-spacing="0">und klären Ihre Ziele.</text><line x1="113" y1="118" x2="189" y2="118" stroke="#DCD0C1" stroke-width="0.23" opacity="1" /><text x="113" y="133" fill="#AC8C64" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="6.6" text-anchor="start" letter-spacing="0">02</text><text x="129" y="132" fill="#2D2420" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="2.6" text-anchor="start" letter-spacing="0.3">PFLEGEN</text><text x="129" y="138.0" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.01" text-anchor="start" letter-spacing="0">Wir wählen die passende Behandlung</text>
<text x="129" y="142.8" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.01" text-anchor="start" letter-spacing="0">und die Pflege für zu Hause.</text><line x1="113" y1="151" x2="189" y2="151" stroke="#DCD0C1" stroke-width="0.23" opacity="1" /><text x="113" y="166" fill="#AC8C64" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="6.6" text-anchor="start" letter-spacing="0">03</text><text x="129" y="165" fill="#2D2420" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="2.6" text-anchor="start" letter-spacing="0.3">BEGLEITEN</text><text x="129" y="171.0" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.01" text-anchor="start" letter-spacing="0">Beim nächsten Termin schauen wir,</text>
<text x="129" y="175.8" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.01" text-anchor="start" letter-spacing="0">was sich verändert hat und was hilft.</text><line x1="113" y1="196" x2="189" y2="196" stroke="#AC8C64" stroke-width="0.35" opacity="1" /><text x="113" y="203" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="2.18" text-anchor="start" letter-spacing="0.42">PFLEGE MIT SINN UND SUBSTANZ.</text></g>
<g id="p4" inkscape:groupmode="layer" inkscape:label="Seite 4 · Schwerpunkte"><text x="212" y="20" fill="#AC8C64" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="2.65" text-anchor="start" letter-spacing="0.43">03  /  SCHWERPUNKTE</text><text x="212" y="39.5" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="11.8" text-anchor="start" letter-spacing="0">Was Ihrer Haut</text>
<text x="212" y="51.8" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="11.8" text-anchor="start" letter-spacing="0">guttut.</text><text x="212" y="67.4" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.13" text-anchor="start" letter-spacing="0">Jede Haut ist anders. Diese Bausteine</text>
<text x="212" y="72.30000000000001" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="3.13" text-anchor="start" letter-spacing="0">stimme ich auf Sie ab.</text><line x1="212" y1="82" x2="289" y2="82" stroke="#B9A58D" stroke-width="0.28" opacity="1" /><text x="212" y="89" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="3.32" text-anchor="start" letter-spacing="0.07">Hautanalyse &amp; Beratung</text><text x="212" y="94.2" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="2.79" text-anchor="start" letter-spacing="0">Ihre Ziele, Ihr Hautbild, Ihre Fragen.</text><line x1="212" y1="106" x2="289" y2="106" stroke="#B9A58D" stroke-width="0.28" opacity="1" /><text x="212" y="113" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="3.32" text-anchor="start" letter-spacing="0.07">Individuelle Gesichtsbehandlung</text><text x="212" y="118.2" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="2.79" text-anchor="start" letter-spacing="0">Abgestimmt auf die aktuellen Bedürfnisse.</text><line x1="212" y1="130" x2="289" y2="130" stroke="#B9A58D" stroke-width="0.28" opacity="1" /><text x="212" y="137" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="3.32" text-anchor="start" letter-spacing="0.07">Apparative Anwendungen</text><text x="212" y="142.2" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="2.79" text-anchor="start" letter-spacing="0">Gezielt ausgewählt und fachkundig eingesetzt.</text><line x1="212" y1="154" x2="289" y2="154" stroke="#B9A58D" stroke-width="0.28" opacity="1" /><text x="212" y="161" fill="#2D2420" font-family="EB Garamond, Garamond, Georgia, serif" font-weight="normal" font-size="3.32" text-anchor="start" letter-spacing="0.07">Pflege für zu Hause</text><text x="212" y="166.2" fill="#77685C" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="2.79" text-anchor="start" letter-spacing="0">Konkrete Empfehlungen für Ihren Alltag.</text><line x1="212" y1="181" x2="289" y2="181" stroke="#AC8C64" stroke-width="0.4" opacity="1" /><text x="212" y="190.0" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="2.94" text-anchor="start" letter-spacing="0">Lernen Sie Ihre Haut neu kennen.</text>
<text x="212" y="195.0" fill="#3E3029" font-family="Inter, Arial, sans-serif" font-weight="normal" font-size="2.94" text-anchor="start" letter-spacing="0">Ich freue mich auf Ihren Besuch.</text><text x="212" y="206" fill="#AC8C64" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="2.1" text-anchor="start" letter-spacing="0.24">ALWAYS BEAUTY · Ihre Haut. Ihre Zeit.</text></g>
</svg>